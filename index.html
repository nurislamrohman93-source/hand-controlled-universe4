<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Hand Controlled Universe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#camera{
    position:fixed;
    width:1px;
    height:1px;
    left:-100px;
    top:-100px;
    opacity:0;
    pointer-events:none;
}

#info{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    color:white;
    text-align:center;

    padding:12px 20px;
    border-radius:25px;

    background:rgba(0,0,0,.35);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.15);

    pointer-events:none;
}

#info h2{
    font-size:18px;
    margin-bottom:5px;
}

#info p{
    font-size:11px;
    opacity:.75;
}

#start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    z-index:30;

    padding:16px 28px;

    border:none;
    border-radius:35px;

    background:white;
    color:#000;

    font-size:16px;
    font-weight:bold;

    box-shadow:0 0 35px rgba(255,255,255,.5);
}

    left:50%;
    bottom:20px;
